<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salon At Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">SalonAtHome</div>
  <div class="city">Kanpur</div>
</div>

<!-- CATEGORY -->
<div class="category">
  <button onclick="filterServices('all')">All</button>
  <button onclick="filterServices('cleanup')">Cleanup</button>
  <button onclick="filterServices('waxing')">Waxing</button>
</div>

<!-- SERVICES -->
<div class="services" id="services"></div>

<!-- STICKY CART -->
<div class="sticky-bar" id="stickyBar">
  <button onclick="goToBooking()">View Booking (0)</button>
</div>

<script src="script.js"></script>
</body>
</html>
